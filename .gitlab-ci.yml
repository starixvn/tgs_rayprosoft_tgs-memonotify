include:
  - project: rayprosoft/tgs-ci-scripts
    ref: main
    file: GitLab/Templates/gitlab-job-templates.yml

variables:
  ImageName: pgtgs/tst-memo
  TgsSettingKey: tst-memo
  HelmTemplateFolderName: tst-memo

stages:
  - build
  - test
  - publish
  - deploy-dev
  - deploy-staging
  - deploy-prod

build-code:
  extends: .build-code-template
  script:
    - npm ci --prefix browser_client
    - npm run build-test --prefix browser_client
    - dotnet build -c $BuildConfiguration

unit-test:
  extends: .unit-test-template

push-docker-image:
  extends: .push-docker-image-template
  script:
    - push_docker 'Tgs.MemoNotify/Tgs.MemoNotify.csproj' $ImageName $Tag

push-k8s-template:
  extends: .push-k8s-template

.deploy-ingress-template:
  extends: .deploy-template
  before_script:
    - !reference [.deploy-template, before_script]
    - |
      function deploy_k8s() {
        local settingKey=$1
        local helmFolderName=$2
        local ns=$3
        local extendSettings=${4:-$(</dev/stdin)}

        local resources=$(kubectl get cm resources-setting -o jsonpath={.data.${settingKey:=$TgsSettingKey}})
        local dedicated=$(kubectl get cm tgs-settings -o jsonpath={.data.dedicated})
        local node_selector=$(kubectl get cm tgs-settings -o jsonpath={.data.node-selector})
        local autoscaling=$(kubectl get cm autoscaling-setting -o jsonpath={.data.${settingKey:=$TgsSettingKey}})

        local valueConfig=$(
          cat << EOF
          {
            "replicaCount": $replica,
            "nodeSelector": $node_selector,
            "tolerations": [$dedicated],
            "resources": $resources,
            "autoscaling": $autoscaling
          }
      EOF
        )

        echo "$valueConfig $extendSettings" | jq -s 'reduce .[] as $item ({}; . * $item)' \
          | yq e -P | helm template artifacts/k8s/${helmFolderName:=$HelmTemplateFolderName} \
          -n ${ns:=$namespace} \
          --name-template tgs \
          -f -

        echo "$valueConfig $extendSettings" | jq -s 'reduce .[] as $item ({}; . * $item)' \
          | yq e -P | helm template artifacts/k8s/${helmFolderName:=$HelmTemplateFolderName} \
          -n ${ns:$namespace} \
          --name-template tgs \
          -f - \
          | kubectl -n ${ns:=$namespace} apply -f -
      }

deploy-dev:
  extends: .deploy-ingress-template
  variables:
    namespace: dev
    kube_config: KubeConfig_Raypro_dev
  environment:
    name: dev
  stage: deploy-dev
  needs:
    - push-docker-image
    - job: push-k8s-template
      artifacts: true
  only:
    - main
  when: on_success
  script:
    - |
      cat << EOF | deploy_k8s $TgsSettingKey $HelmTemplateFolderName $namespace 
        {
          "storageType": "Memory",
          "ingress": {
            "enabled": true,
            "hosts": [
              {
                "host": "dev-memo.rpgp.cc",
                "paths": [
                  {
                    "path": "/",
                    "pathType": "Prefix"
                  }
                ]
              }
            ]
          }
        }
      EOF

deploy-staging:
  extends: .deploy-ingress-template
  variables:
    namespace: staging
    kube_config: KubeConfig_Raypro_staging
  environment:
    name: staging
  stage: deploy-staging
  needs:
    - deploy-dev
    - job: push-k8s-template
      artifacts: true
  only:
    - main
  when: manual
  script:
    - |
      cat << EOF | deploy_k8s $TgsSettingKey $HelmTemplateFolderName $namespace 
        {
          "storageType": "Memory",
          "ingress": {
            "enabled": true,
            "hosts": [
              {
                "host": "dev-memo.rpgp.cc",
                "paths": [
                  {
                    "path": "/",
                    "pathType": "Prefix"
                  }
                ]
              }
            ]
          }
        }
      EOF

deploy-prod:
  extends: .deploy-ingress-template
  variables:
    namespace: prod
    kube_config: KubeConfig_Raypro_prod
  environment:
    name: prod
  stage: deploy-prod
  needs:
    - deploy-staging
    - job: push-k8s-template
      artifacts: true
  only:
    - main
  when: manual
  script:
    - |
      cat << EOF | deploy_k8s $TgsSettingKey $HelmTemplateFolderName $namespace 
        {
          "storageType": "Memory",
          "ingress": {
            "enabled": true,
            "hosts": [
              {
                "host": "dev-memo.rpgp.cc",
                "paths": [
                  {
                    "path": "/",
                    "pathType": "Prefix"
                  }
                ]
              }
            ]
          }
        }
      EOF
