apiVersion: v1
kind: ConfigMap
metadata:
  name: configmap-{{ include "tst-memo.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    type: backend
    {{- include "tst-memo.labels" . | nindent 4 }}
data:
  appsettings.json: |
    {
      "MemoSettings": {
        "GameServerBaseUri": "http://tgs-game-server",
        "Token": "{{ .Values.botToken }}",
        "TstChatId": "{{ .Values.chatId }}"
      }
    }
  otel-collector-config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:

    processors:
      batch:

    exporters:
      otlp:
        endpoint: "$NODE_IP:4317"
        tls:
          insecure: true
      prometheus:
        endpoint: "0.0.0.0:8889"
        namespace: "tgs"

    extensions:
      health_check:
        endpoint: 0.0.0.0:13133

    service:
      extensions: [health_check]
      pipelines:
        traces: 
          receivers: [otlp]
          processors:
            - batch
          exporters: [otlp]
        metrics:
          receivers: [otlp]
          exporters: [prometheus]
