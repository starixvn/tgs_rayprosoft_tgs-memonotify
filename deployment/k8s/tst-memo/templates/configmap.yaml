apiVersion: v1
kind: ConfigMap
metadata:
  name: configmap-{{ include "tst-memo.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    type: backend
    {{- include "tst-memo.labels" . | nindent 4 }}
data:
  yarp-settings.json: |
    {
      "Logging": {
        "LogLevel": {
          "Microsoft.AspNetCore.HttpLogging": "Information"
        }
      },
      "HttpLogging": {
        "LoggingFields": "Request",
        "RequestHeaders": ["cf-connecting-ip", "X-Forwarded-For", "X-Real-IP"]
      },
      "ReverseProxy": {
        "Routes": {
          "route1": {
            "ClusterId": "cluster1",
            "Match": {
              "Path": "{**catch-all}"
            }
          }
        },
        "Clusters": {
          "cluster1": {
            "Destinations": {
              "destination1": {
                "Address": "http://localhost/"
              }
            }
          }
        }
      }
    }
  otel-collector-config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:

    processors:
      batch:

    exporters:
      otlp:
        endpoint: "$NODE_IP:4317"
        tls:
          insecure: true
      prometheus:
        endpoint: "0.0.0.0:8889"
        namespace: "tgs"

    extensions:
      health_check:
        endpoint: 0.0.0.0:13133

    service:
      extensions: [health_check]
      pipelines:
        traces: 
          receivers: [otlp]
          processors:
            - batch
          exporters: [otlp]
        metrics:
          receivers: [otlp]
          exporters: [prometheus]
